name: Pin CDN hash

on:
  push:
    branches: [master]
    paths:
      - 'css/**'
      - 'docs/**/index.html'

permissions:
  contents: write

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rewrite CDN hash to this commit
        run: |
          find docs -name 'index.html' -exec sed -E -i \
            "s|(cdn\.jsdelivr\.net/gh/Deufel/toolbox@)[^/]+|\1${GITHUB_SHA}|g" {} +

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Hash already current — nothing to do."
            exit 0
          fi
          git add docs
          git commit -m "chore: pin CDN hash to ${GITHUB_SHA}"
          git push

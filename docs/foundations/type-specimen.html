<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type specimen</title>
<link rel="stylesheet" href="../system.css">
<script>
  // size/theme come from the embedding frame's query string; fluid type keys off
  // this document's own viewport, so a 375px-wide iframe renders the small end.
  var q = new URLSearchParams(location.search);
  var r = document.documentElement;
  r.setAttribute('data-ui-size', q.get('size') || 'md');
  r.setAttribute('data-ui-theme', q.get('theme') || 'light');
</script>
<style>
  @layer project {
    .label { --type:-1; --fg:-0.5; font-family:var(--font-mono); }
  }
</style>
</head>
<body>
<div class="page">
  <main class="pg-main" style="--bg:0; padding:0.75lh 0.9em;">
    <div class="column" style="gap:0.4lh;">
      <span class="label" data-w>width</span>
      <div style="--type:5;">Heading one</div>
      <div style="--type:4;">Heading two</div>
      <div style="--type:3;">Heading three</div>
      <div style="--type:1;">A subheading</div>
      <p style="--type:0; margin:0;">Body copy at type 0 — the quick brown fox jumps over the lazy dog and keeps going
         until it wraps, so the leading shows at this width.</p>
      <small style="--type:-1;">Caption at type −1.</small>
      <small style="--type:-2;">Fine print at type −2.</small>
      <div class="row" style="gap:0.5em; align-items:center; margin-block-start:0.3lh;">
        <button style="--bg:0.45; --fg:-1;">Button</button>
        <input type="text" placeholder="Input (16px floor on touch)">
        <span class="tag inf">tag</span>
      </div>
    </div>
  </main>
</div>
<script>
  // show the live viewport width so each frame is self-labelling
  var w = document.querySelector('[data-w]');
  function showW(){ w.textContent = Math.round(document.documentElement.clientWidth) + 'px · ' + (q.get('size')||'md'); }
  showW(); addEventListener('resize', showW);
</script>
</body>
</html>

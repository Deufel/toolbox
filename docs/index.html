<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="system.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono&family=JetBrains+Mono&display=swap" rel="stylesheet">
<script src="highlight.js"></script>
<style>
  body { margin: 0; }
  .brand { display: flex; align-items: center; gap: 0.5em; font-weight: 650; }
  .brand-dot { inline-size: 1.1em; block-size: 1.1em; border-radius: 4px; background: oklch(var(--l-color) var(--c-peak) var(--hue)); }
  .pg-header { flex-wrap: wrap; gap: 0.4lh 0.7em; view-transition-name: vt-header; }
  .pg-navigation { view-transition-name: vt-nav; }
  .pg-footer { view-transition-name: vt-footer; }
</style>
</helmet>

<div class="page {{ pageWidthClass }}" style="--hue: {{ pageHue }}" data-ui-theme="{{ pageTheme }}" data-ui-size="{{ pageSize }}" data-ui-skin="{{ pageSkin }}" data-ui-motion="{{ pageMotion }}">

  <header class="pg-header spread">
    <div class="brand"><span class="brand-dot"></span> system.css <span class="tag" style="--type:-2">docs</span></div>
    <div class="row" style="gap: 0.7em">
      <div class="row" style="gap: 0.35em">
        <small style="--fg:-0.6">hue</small>
        <input type="range" min="0" max="360" step="1" value="{{ pageHue }}" onInput="{{ setPageHue }}" style="inline-size: 6em">
        <code style="--type:-1; display:inline-block; min-inline-size:2.6em; text-align:end; white-space:nowrap">{{ pageHue }}</code>
      </div>
      <label class="row" style="gap:0.35em"><small style="--fg:-0.6">skin</small>
        <select value="{{ pageSkin }}" onChange="{{ setSkin }}">
          <option value="">base</option>
          <option value="vivid">vivid</option>
          <option value="material">material</option>
          <option value="carbon">carbon</option>
          <option value="tw">tw</option>
        </select>
      </label>
      <div class="button-group" role="group" aria-label="Density">
        <button aria-pressed="{{ isSm }}" onClick="{{ goSm }}">S</button>
        <button aria-pressed="{{ isMd }}" onClick="{{ goMd }}">M</button>
        <button aria-pressed="{{ isLg }}" onClick="{{ goLg }}">L</button>
      </div>
      <div class="button-group" role="group" aria-label="Motion">
        <button aria-pressed="{{ isMotionOff }}" onClick="{{ goMotionOff }}">Off</button>
        <button aria-pressed="{{ isMotionOn }}" onClick="{{ goMotionOn }}">On</button>
        <button aria-pressed="{{ isMotionDebug }}" onClick="{{ goMotionDebug }}">Debug</button>
      </div>
      <div class="button-group" role="group" aria-label="Width">
        <button aria-pressed="{{ isCentered }}" onClick="{{ goCentered }}">Centered</button>
        <button aria-pressed="{{ isFull }}" onClick="{{ goFull }}">Full</button>
      </div>
      <div class="button-group" role="group" aria-label="Theme">
        <button aria-pressed="{{ isLight }}" onClick="{{ goLight }}">Light</button>
        <button aria-pressed="{{ isDark }}" onClick="{{ goDark }}">Dark</button>
      </div>
    </div>
  </header>

  <nav class="pg-navigation column" style="gap: 0.1lh; padding: 0.4lh 0.35em">
    <small style="--fg:-0.55; --type:-2; padding-inline:0.6em; margin-block-end:0.2lh">TYPE</small>
    <a class="nav-item clickable" onClick="{{ go.type }}" aria-current="{{ ac.type }}"><span>How type works</span></a>
    <a class="nav-item clickable" onClick="{{ go.controls }}" aria-current="{{ ac.controls }}"><span>Control heights</span></a>
    <small style="--fg:-0.55; --type:-2; padding-inline:0.6em; margin-block: 0.4lh 0.2lh">COLOR</small>
    <a class="nav-item clickable" onClick="{{ go.color }}" aria-current="{{ ac.color }}"><span>The engine</span></a>
    <small style="--fg:-0.55; --type:-2; padding-inline:0.6em; margin-block: 0.4lh 0.2lh">SYSTEM</small>
    <a class="nav-item clickable" onClick="{{ go.layers }}" aria-current="{{ ac.layers }}"><span>The layer spine</span></a>
    <small style="--fg:-0.55; --type:-2; padding-inline:0.6em; margin-block: 0.4lh 0.2lh">LAYOUT</small>
    <a class="nav-item clickable" onClick="{{ go.layout }}" aria-current="{{ ac.layout }}"><span>Page &amp; helpers</span></a>
    <a class="nav-item clickable" onClick="{{ go.transitions }}" aria-current="{{ ac.transitions }}"><span>View transitions</span></a>
    <small style="--fg:-0.55; --type:-2; padding-inline:0.6em; margin-block: 0.4lh 0.2lh">COMPONENTS</small>
    <a class="nav-item clickable" onClick="{{ go.components }}" aria-current="{{ ac.components }}"><span>Overview</span></a>
    <small style="--fg:-0.55; --type:-2; padding-inline:0.6em; margin-block: 0.4lh 0.2lh">DEMOS</small>
    <a class="nav-item clickable" onClick="{{ go.demos }}" aria-current="{{ ac.demos }}"><span>Full pages</span></a>
  </nav>

  <main class="pg-main">
    <sc-if value="{{ isType }}" hint-placeholder-val="{{ false }}"><dc-import name="section-type" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ isControls }}" hint-placeholder-val="{{ false }}"><dc-import name="section-controls" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ isColor }}" hint-placeholder-val="{{ false }}"><dc-import name="section-color" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ isLayers }}" hint-placeholder-val="{{ false }}"><dc-import name="section-layers" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ isLayout }}" hint-placeholder-val="{{ false }}"><dc-import name="section-layout" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ isTransitions }}" hint-placeholder-val="{{ false }}"><dc-import name="section-transitions" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ isComponents }}" hint-placeholder-val="{{ false }}"><dc-import name="section-components" hint-size="100%,100%"></dc-import></sc-if>
    <sc-if value="{{ isDemos }}" hint-placeholder-val="{{ false }}"><dc-import name="section-demos" hint-size="100%,100%"></dc-import></sc-if>
  </main>

  <footer class="pg-footer spread">
    <small style="--fg:-0.6">system.css · living documentation</small>
    <small style="--fg:-0.6">one shell · {{ sectionLabel }}</small>
  </footer>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { pageHue: 255, pageTheme: "light", pageSize: "md", pageSkin: "", pageMotion: "on", pageWidth: "centered", section: "color" };

  files = {
    type: "section-type",
    controls: "section-controls",
    color: "section-color",
    layers: "section-layers",
    layout: "section-layout",
    transitions: "section-transitions",
    components: "section-components",
    demos: "section-demos",
  };
  labels = {
    type: "How type works", controls: "Control heights", color: "The engine",
    layers: "The layer spine", layout: "Page & helpers", transitions: "View transitions", components: "Components", demos: "Full pages",
  };

  // The VT pseudo-elements live on :root (<html>), but the header writes
  // data-ui-motion on the inner .page div — and --cfg-motion can't inherit
  // upward. Mirror motion onto <html> so the transition duration actually
  // tracks Off / On / Debug (and prefers-reduced-motion).
  syncMotion() { document.documentElement.dataset.uiMotion = this.state.pageMotion; }
  componentDidMount() { this.syncMotion(); }

  vt(update, dir) {
    const root = document.documentElement;
    if (!document.startViewTransition) { update(); return; }
    if (dir) root.dataset.vt = dir; else root.removeAttribute("data-vt");
    document.startViewTransition(() => new Promise((res) => {
      update();
      requestAnimationFrame(() => requestAnimationFrame(res));
    }));
  }

  order = ["type", "controls", "color", "layers", "layout", "transitions", "components", "demos"];

  go(key) {
    return () => {
      const dir = this.order.indexOf(key) < this.order.indexOf(this.state.section) ? "slide-right" : "slide-left";
      this.vt(() => this.setState({ section: key }), dir);
    };
  }

  renderVals() {
    const s = this.state.section;
    const keys = ["type", "controls", "color", "layers", "layout", "transitions", "components", "demos"];
    const go = {}, ac = {};
    keys.forEach((k) => { go[k] = this.go(k); ac[k] = (s === k ? "page" : "false"); });
    return {
      ...this.state,
      go, ac,
      pageWidthClass: this.state.pageWidth === "full" ? "" : "centered",
      isCentered: this.state.pageWidth === "centered",
      isFull: this.state.pageWidth === "full",
      goCentered: () => this.vt(() => this.setState({ pageWidth: "centered" }), "fade"),
      goFull: () => this.vt(() => this.setState({ pageWidth: "full" }), "fade"),
      isType: s === "type",
      isControls: s === "controls",
      isColor: s === "color",
      isLayers: s === "layers",
      isLayout: s === "layout",
      isTransitions: s === "transitions",
      isComponents: s === "components",
      isDemos: s === "demos",
      sectionFile: this.files[s] || "section-color",
      sectionLabel: this.labels[s] || "",
      isLight: this.state.pageTheme === "light",
      isDark: this.state.pageTheme === "dark",
      goLight: () => this.vt(() => this.setState({ pageTheme: "light" }), "fade"),
      goDark: () => this.vt(() => this.setState({ pageTheme: "dark" }), "fade"),
      isSm: this.state.pageSize === "sm",
      isMd: this.state.pageSize === "md",
      isLg: this.state.pageSize === "lg",
      goSm: () => this.setState({ pageSize: "sm" }),
      goMd: () => this.setState({ pageSize: "md" }),
      goLg: () => this.setState({ pageSize: "lg" }),
      isMotionOff: this.state.pageMotion === "off",
      isMotionOn: this.state.pageMotion === "on",
      isMotionDebug: this.state.pageMotion === "debug",
      goMotionOff: () => this.setState({ pageMotion: "off" }, () => this.syncMotion()),
      goMotionOn: () => this.setState({ pageMotion: "on" }, () => this.syncMotion()),
      goMotionDebug: () => this.setState({ pageMotion: "debug" }, () => this.syncMotion()),
      setSkin: (e) => { const v = e.target.value; this.vt(() => this.setState({ pageSkin: v }), "fade"); },
      setPageHue: (e) => this.setState({ pageHue: parseFloat(e.target.value) }),
    };
  }
}
</script>
</body>
</html>

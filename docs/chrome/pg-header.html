<header id="pg-header" class="pg-header bg fg edge-q pad" style="--bg:-0.4">
  <div class="column">
    <div class="spread">
      <strong style="--type:0.5">Toolbox</strong>
      <div class="row">
        <button class="icon-btn" style="--bg:0.4"
                aria-label="cycle type scale" title="Type"
                data-on:click="$type = $type === 'sm' ? 'md' : $type === 'md' ? 'lg' : 'sm'">
          <!-- lucide: case-sensitive -->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 15 4-8 4 8"/>
            <path d="M4 13h6"/>
            <circle cx="18" cy="12" r="3"/>
            <path d="M21 9v6"/>
          </svg>
        </button>
        <button class="icon-btn" style="--bg:0.4"
                aria-label="toggle theme" title="Theme"
                data-on:click="$theme = $theme === 'dark' ? 'light' : 'dark'">
          <!-- lucide: moon -->
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"/>
          </svg>
        </button>
      </div>
    </div>
    <!-- crumb trail — built once at init from $path -->
    <nav class="crumbs" data-init="
      const parts = $path.split('/').filter(Boolean);
      const subs = parts[0] === 'toolbox' ? parts.slice(1) : parts;
      let trail = '<a href=&quot;/toolbox/&quot;>Home</a>';
      subs.forEach((s, i) => {
        const href = '/toolbox/' + subs.slice(0, i+1).join('/') + '/';
        const label = s.charAt(0).toUpperCase() + s.slice(1);
        trail += '<a href=&quot;' + href + '&quot;>' + label + '</a>';
      });
      el.innerHTML = trail;
    "></nav>
  </div>
</header>

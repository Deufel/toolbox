<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Go — Toolbox</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Deufel/toolbox@898e78a5b88385125a71e55ab7b2ce38d4e6aa89/css/style.css">
<script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.1/bundles/datastar.js"></script>
<script src="https://cdn.jsdelivr.net/gh/Deufel/toolbox@898e78a5b88385125a71e55ab7b2ce38d4e6aa89/js/highlight.js"></script>
</head>
<body class="page bg fg centered"
      data-signals="{theme: 'dark', type: 'md', path: ''}"
      data-init="$path = window.location.pathname"
      data-effect="document.body.setAttribute('data-ui-theme', $theme); document.body.setAttribute('data-ui-type', $type)">

  <header id="pg-header"
          data-init="@get('/toolbox/chrome/pg-header.html')"></header>

  <nav id="pg-navigation"
       data-init="@get('/toolbox/chrome/pg-navigation.html')"></nav>

  <main class="pg-main pad">
    <h1 style="--type:2">Go</h1>
  </main>

  <footer id="pg-footer"
          data-init="@get('/toolbox/chrome/pg-footer.html')"></footer>

</body>
</html>

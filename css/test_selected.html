<!doctype html>
<html lang="en" data-ui-theme="dark" data-ui-size="md">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>select isolation test</title>
<link rel="stylesheet" href="system.css">
<style>
  body { padding: 2lh 1.5em; --bg: -0.5; background-color: var(--_bg); --surf-l: var(--_bg-l); min-block-size: 100svh; }
  .wrap { max-inline-size: 30rem; margin-inline: auto; display: flex; flex-direction: column; gap: 1.5lh; }
  .lab { --type: -1; --fg: -0.5; font-family: var(--font-mono); }
  .probe { --type: -2; --fg: -0.6; font-family: var(--font-mono); white-space: pre-line; }
  h1 { --type: 3; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Select isolation</h1>

  <div>
    <span class="lab">bare select, no form</span>
    <select style="min-inline-size:14em;margin-top:0.4lh">
      <button><selectedcontent></selectedcontent></button>
      <option value="apple">Apple</option>
      <option value="banana">Banana</option>
      <option value="cherry" selected>Cherry (preselected)</option>
      <option value="grape">Grape</option>
    </select>
  </div>

  <div>
    <span class="lab">with icons</span>
    <select style="min-inline-size:14em;margin-top:0.4lh">
      <button><selectedcontent></selectedcontent></button>
      <option value="a"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>With circle</option>
      <option value="b"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16"/></svg>With square</option>
    </select>
  </div>

  <div>
    <span class="lab">theme / size</span>
    <div style="display:flex;gap:0.5em;margin-top:0.4lh">
      <select onchange="document.documentElement.setAttribute('data-ui-theme',this.value)" style="min-inline-size:8em">
        <button><selectedcontent></selectedcontent></button>
        <option value="dark">dark</option><option value="light">light</option>
      </select>
      <select onchange="document.documentElement.setAttribute('data-ui-size',this.value)" style="min-inline-size:8em">
        <button><selectedcontent></selectedcontent></button>
        <option value="sm">sm</option><option value="md" selected>md</option><option value="lg">lg</option>
      </select>
    </div>
  </div>

  <div class="probe" id="probe">measuring…</div>
</div>

<script>
  // measure computed font-size + box height of the button's selectedcontent
  // vs an option, to see if they actually differ
  function measure() {
    const sel = document.querySelector('select');
    const sc = sel.querySelector('selectedcontent');
    const opt = sel.querySelector('option');
    const btn = sel.querySelector('button') || sel;
    const g = el => el ? getComputedStyle(el) : null;
    const scs = g(sc), os = g(opt), bs = g(btn), ss = g(sel);
    document.getElementById('probe').textContent =
      `select       font-size: ${ss.fontSize}  --type: ${ss.getPropertyValue('--type')||'(unset)'}\n` +
      `button       font-size: ${bs.fontSize}\n` +
      `selectedcontent font-size: ${scs?scs.fontSize:'n/a'}  height: ${sc?sc.getBoundingClientRect().height.toFixed(1):'n/a'}px\n` +
      `selectedcontent background: ${scs?scs.backgroundColor:'n/a'}\n` +
      `option       font-size: ${os.fontSize}  height: ${opt.getBoundingClientRect().height.toFixed(1)}px\n` +
      `(option height is 0 if picker closed — open it then re-measure)`;
  }
  measure();
  document.addEventListener('click', () => setTimeout(measure, 100));
</script>
</body>
</html>

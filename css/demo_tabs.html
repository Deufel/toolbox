<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tabs — system.css demo</title>
  <!-- the ONLY styling: the design system. zero styles of its own. -->
  <link rel="stylesheet" href="system.css">
</head>
<body>
  <main class="read">

    <h1>.tabs — segmented radio</h1>
    <p>Every group below is the <code>.tabs</code> component from system.css, used as-is. This page ships no CSS of its own.</p>

    <!-- 1. canonical: with a legend (breaks out above the groove) -->
    <div role="group" class="tabs" aria-labelledby="cc-lbl">
      <span class="legend" id="cc-lbl">Card type <small>Pick one.</small></span>
      <label><input type="radio" name="cc" checked><span>Visa</span></label>
      <label><input type="radio" name="cc"><span>Mastercard</span></label>
      <label><input type="radio" name="cc"><span>Amex</span></label>
    </div>

    <!-- 2. no legend: a nearby heading names the group -->
    <h2 id="view-lbl">View</h2>
    <div role="group" class="tabs" aria-labelledby="view-lbl">
      <label><input type="radio" name="view"><span>Day</span></label>
      <label><input type="radio" name="view" checked><span>Week</span></label>
      <label><input type="radio" name="view"><span>Month</span></label>
    </div>

    <!-- 3. two options, semantically labelled but legend visually hidden -->
    <div role="group" class="tabs" aria-labelledby="bill-lbl">
      <span class="legend vh" id="bill-lbl">Billing period</span>
      <label><input type="radio" name="bill" checked><span>Monthly</span></label>
      <label><input type="radio" name="bill"><span>Yearly</span></label>
    </div>

    <!-- 4. inside a form — radios still post, keyboard + AT intact -->
    <form>
      <div role="group" class="tabs" aria-labelledby="plan-lbl">
        <span class="legend" id="plan-lbl">Plan <small>Choose a tier.</small></span>
        <label><input type="radio" name="plan" value="free"><span>Free</span></label>
        <label><input type="radio" name="plan" value="pro" checked><span>Pro</span></label>
        <label><input type="radio" name="plan" value="team"><span>Team</span></label>
        <label><input type="radio" name="plan" value="ent"><span>Enterprise</span></label>
      </div>
    </form>

  </main>
</body>
</html>
